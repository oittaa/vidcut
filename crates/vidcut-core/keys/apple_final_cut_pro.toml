[keys]
play_or_stop = ["Space"]
play_backward = ["J"]
stop = ["K"]
play_forward = ["L"]
frame_back = ["Left"]
frame_forward = ["Right"]
previous_cut = ["Up", ";"]
next_cut = ["Down", "'"]
previous_marker = ["Control+;"]
next_marker = ["Control+'"]
timeline_start = ["Home"]
timeline_end = ["End"]
go_to_timecode = ["Control+P"]
loop = ["Ctrl+L"]
mark_in = ["I"]
mark_out = ["O"]
go_to_in = ["Shift+I"]
go_to_out = ["Shift+O"]
clear_marks = ["Alt+X"]
add_marker = ["M"]
delete_marker = ["Control+M"]
overwrite = ["D"]
place_on_top = ["Q"]
append = ["E"]
dissolve = ["Ctrl+T"]
delete = ["Backspace"]
lift = ["Shift+Backspace"]
copy = ["Ctrl+C"]
cut = ["Ctrl+X"]
paste_attributes = ["Ctrl+Shift+V"]
transform = ["Shift+T"]
crop = ["Shift+C"]
change_duration = ["Control+D"]
edit_subtitle = ["Control+Shift+C"]
next_keyframe = ["Alt+'"]
previous_keyframe = ["Alt+;"]
select_all = ["Ctrl+A"]
select_nothing = ["Ctrl+Shift+A"]
snapping = ["N"]
undo = ["Ctrl+Z"]
redo = ["Ctrl+Shift+Z"]
import = ["Ctrl+I"]
new_timeline = ["Ctrl+N"]
preferences = ["Ctrl+,"]
