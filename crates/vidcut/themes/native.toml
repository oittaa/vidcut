# Native, the default: the layered grays, corners and font of a desktop
# app, light or dark as the computer is set, in its accent color.
# [light_mode] holds what changes while the computer is in light mode.

title = "Native"
light = false

[colors]
background = "#202020"
panel = "#282828"
panel_dark = "#1C1C1C"
track = "#1A1A1A"
track_target = "#182430"
panel_target = "#1C3E5C"
text = "#F3F3F3"
text_dim = "#A6A6A6"
accent = "system-light"
playhead = "#FF5252"
clip = "system-dark"
clip_disabled = "#383838"
offline = "#AA3232"
audio = "#2E7850"
generator = "#785AB4"
compound = "#AA6E3C"
marked = "#5A5A5A46"
error = "#FF99A4"
ok = "#6CCB5F"
selection = "system-dark"
selected_text = "#FFFFFF"
field = "#181818"
faint = "#2E2E2E"
line = "#383838"
button = "#484848"
button_line = "#4A4A4A"
button_hovered = "#3C3C3C"
button_pressed = "#303030"
shadow = "#0000008C"

[shape]
corners = 4
windows = 8
menus = 8
panels = 8
clips = 4
gap = 2
padding = 10
bar_padding = [8, 5]
spacing = [8, 6]
button_padding = [11, 5]
button_height = 26
buttons = "flat"
panel_border = true
shadow = [0, 8, 16]

[fonts]
ui = ["system"]
mono = ["system"]
size = 14
small = 11
heading = 20
mono_size = 13

[decoration]
style = "none"

[light_mode]
light = true

[light_mode.colors]
background = "#F3F3F3"
panel = "#FAFAFA"
panel_dark = "#ECECEC"
track = "#E6E6E6"
track_target = "#D6E8F8"
panel_target = "#CCE2F6"
text = "#1B1B1B"
text_dim = "#606060"
accent = "system-dark"
playhead = "#D62828"
clip = "system-light"
clip_disabled = "#BEBEBE"
offline = "#D65050"
audio = "#46A86E"
generator = "#9678D2"
compound = "#D28C50"
marked = "#0000001E"
error = "#C42B1C"
ok = "#0F7B0F"
selection = "system"
field = "#FFFFFF"
faint = "#F0F0F0"
line = "#DEDEDE"
button = "#D6D6D6"
button_line = "#D0D0D0"
button_hovered = "#EAEAEA"
button_pressed = "#E0E0E0"
shadow = "#0000003C"
