# Fast gate only: scripts/check.sh (fmt, clippy -D warnings, unit tests), on
# Linux, Windows and macOS.
# scripts/check.sh full (integration, e2e, doc tests) is intentionally not run here,
# but for one cross-check on Linux and Windows: vidcut's OTIO files against
# OpenTimelineIO's own library, which those tests skip without.
name: check

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  # A new push to a pull request replaces its run. Every master commit gets
  # a run of its own.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # No debug info: a smaller cache and faster links. Panics still name the
  # file and line.
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  check:
    name: fmt, clippy, unit tests
    # Pin Ubuntu 26.04. Its apt archive ships FFmpeg 8.0 (libavcodec 62).
    # ubuntu-24.04, and ubuntu-latest until the October 2026 migration,
    # ship FFmpeg 6. Those headers do not match this tree (swr_convert).
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install FFmpeg 8, ALSA and libclang
        run: |
          set -euo pipefail
          # Ubuntu 26.04 (resolute) publishes FFmpeg 8 in the archive.
          # libasound2-dev: the player's audio output (cpal) builds on ALSA.
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            libavcodec-dev \
            libavformat-dev \
            libavfilter-dev \
            libavutil-dev \
            libswscale-dev \
            libswresample-dev \
            libavdevice-dev \
            libasound2-dev \
            libclang-dev \
            pkg-config
          ver=$(dpkg-query -W -f='${Version}' libavcodec-dev)
          upstream=${ver#*:}
          major=${upstream%%.*}
          echo "libavcodec-dev ${ver} (upstream ${upstream})"
          if ! [[ "$major" =~ ^[0-9]+$ ]] || [ "$major" -lt 8 ]; then
            echo "apt FFmpeg ${upstream} is older than 8. This tree needs FFmpeg 8 headers and does not build against FFmpeg 6." >&2
            exit 1
          fi
          pkg-config --exists --print-errors \
            libavcodec libavformat libavfilter libavutil libswscale libswresample libavdevice alsa
          pkg-config --modversion libavcodec libswresample

      - name: Install the pinned Rust toolchain
        run: |
          set -euo pipefail
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.cargo/bin:$PATH"
          # rust-toolchain.toml selects the channel and rustfmt/clippy.
          rustup show active-toolchain
          rustc --version
          cargo fmt --version
          cargo clippy --version
          channel=$(awk -F'"' '/^channel/ { print $2; exit }' rust-toolchain.toml)
          got=$(rustc --version | awk '{ print $2 }')
          if [ "$got" != "$channel" ]; then
            echo "expected rustc ${channel} from rust-toolchain.toml, got ${got}" >&2
            exit 1
          fi

      # After the toolchain step: the cache key includes the rustc version.
      # It keeps the compiled dependencies (target/, not vidcut's own crates)
      # and the downloaded crates. After a Cargo.lock change it restores the
      # previous cache, so only the changed dependencies are compiled again.
      - name: Cache compiled dependencies
        uses: Swatinem/rust-cache@v2

      - name: Fast gate
        # CI is set, so scripts/check.sh omits cargo --quiet and the log
        # shows each crate as it compiles.
        run: scripts/check.sh

      # vidcut's OTIO files against OpenTimelineIO's own Python library
      # (deviation X9): tests/cli.rs skips that part without one. The
      # library and the Python are in tests/otio, where Dependabot sees the
      # library.
      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: OTIO against OpenTimelineIO's library
        run: |
          set -euo pipefail
          uv venv --python "$(tr -d '[:space:]' < tests/otio/.python-version)" "$RUNNER_TEMP/otio"
          uv pip install --python "$RUNNER_TEMP/otio" -r tests/otio/requirements.txt
          export VIDCUT_OTIO_PYTHON="$RUNNER_TEMP/otio/bin/python"
          "$VIDCUT_OTIO_PYTHON" -c "import opentimelineio as o; print('OpenTimelineIO', o.__version__)"
          cargo test -p vidcut --test cli -- otio stills_and_sequences

  windows:
    name: Windows, fmt, clippy, unit tests
    runs-on: windows-2025
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # FFmpeg's newest release as a shared build with its headers and
      # import libraries, as macOS takes Homebrew's newest (Linux builds
      # against the oldest supported, Ubuntu's): BtbN's rolling `latest`
      # release has a build of each recent release branch, and its
      # checksum file names them. No version here to keep up to date; the
      # step prints the one it took. LLVM, whose libclang generates the
      # bindings, comes with the runner.
      - name: Install FFmpeg
        run: |
          set -euo pipefail
          base=https://github.com/BtbN/FFmpeg-Builds/releases/download/latest
          curl -fsSL -o checksums.sha256 "$base/checksums.sha256"
          # The newest release branch's: ffmpeg-n9.0-latest-win64-gpl-shared-9.0.zip.
          zip=$(grep -oE 'ffmpeg-n[0-9]+\.[0-9]+-latest-win64-gpl-shared-[0-9.]+\.zip' checksums.sha256 | sort -V | tail -1)
          curl -fsSL -o "$zip" "$base/$zip"
          grep "  ${zip}\$" checksums.sha256 | sha256sum -c -
          unzip -q "$zip" -d "$RUNNER_TEMP"
          rm "$zip" checksums.sha256
          name=${zip%.zip}
          dir=$(cygpath -w "$RUNNER_TEMP/$name")
          {
            echo "FFMPEG_DIR=${dir}"
            echo "LIBCLANG_PATH=C:\Program Files\LLVM\bin"
          } >> "$GITHUB_ENV"
          "$RUNNER_TEMP/$name/bin/ffmpeg.exe" -hide_banner -version | head -1

      - name: Install the pinned Rust toolchain
        run: |
          set -euo pipefail
          rustup show active-toolchain
          rustc --version
          channel=$(awk -F'"' '/^channel/ { print $2; exit }' rust-toolchain.toml)
          got=$(rustc --version | awk '{ print $2 }')
          if [ "$got" != "$channel" ]; then
            echo "expected rustc ${channel} from rust-toolchain.toml, got ${got}" >&2
            exit 1
          fi

      - name: Cache compiled dependencies
        uses: Swatinem/rust-cache@v2

      - name: Fast gate
        run: scripts/check.sh

      # vidcut's OTIO files against OpenTimelineIO's own Python library
      # (deviation X9): tests/cli.rs skips that part without one. The
      # library and the Python are in tests/otio, where Dependabot sees the
      # library.
      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: OTIO against OpenTimelineIO's library
        run: |
          set -euo pipefail
          uv venv --python "$(tr -d '[:space:]' < tests/otio/.python-version)" "$RUNNER_TEMP/otio"
          uv pip install --python "$RUNNER_TEMP/otio" -r tests/otio/requirements.txt
          export VIDCUT_OTIO_PYTHON="$RUNNER_TEMP/otio/Scripts/python.exe"
          "$VIDCUT_OTIO_PYTHON" -c "import opentimelineio as o; print('OpenTimelineIO', o.__version__)"
          # FFmpeg's DLLs, which scripts/check.sh puts on the path itself.
          PATH="$(cygpath -u "$FFMPEG_DIR")/bin:$PATH"
          cargo test -p vidcut --test cli -- otio stills_and_sequences

  macos:
    name: macOS, fmt, clippy, unit tests
    # Apple Silicon (arm64), pinned like the others.
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Homebrew's ffmpeg-full: the newest release with zimg (zscale, which
      # HDR needs), its headers and pkg-config files. Keg-only. Not pinned:
      # Homebrew keeps one version of a formula. libclang, which generates
      # the bindings, comes with Xcode.
      - name: Install FFmpeg
        run: |
          set -euo pipefail
          brew install ffmpeg-full
          prefix=$(brew --prefix ffmpeg-full)
          export PKG_CONFIG_PATH="${prefix}/lib/pkgconfig"
          echo "PKG_CONFIG_PATH=${PKG_CONFIG_PATH}" >> "$GITHUB_ENV"
          pkg-config --exists --print-errors \
            libavcodec libavformat libavfilter libavutil libswscale libswresample
          pkg-config --modversion libavcodec libswresample
          "${prefix}/bin/ffmpeg" -hide_banner -version | head -1
          "${prefix}/bin/ffmpeg" -hide_banner -filters | grep -w zscale

      - name: Install the pinned Rust toolchain
        run: |
          set -euo pipefail
          rustup show active-toolchain
          rustc --version
          channel=$(awk -F'"' '/^channel/ { print $2; exit }' rust-toolchain.toml)
          got=$(rustc --version | awk '{ print $2 }')
          if [ "$got" != "$channel" ]; then
            echo "expected rustc ${channel} from rust-toolchain.toml, got ${got}" >&2
            exit 1
          fi

      # As on Linux and Windows: master's run saves the compiled
      # dependencies, and every later run (pull requests too) starts from
      # them.
      - name: Cache compiled dependencies
        uses: Swatinem/rust-cache@v2

      - name: Fast gate
        run: scripts/check.sh

