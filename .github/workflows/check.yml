# The fast gate on Linux, Windows and macOS: make check, which also checks
# the Makefile, and scripts/check.sh on Windows, which has no make.
name: check

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  # A new push to a pull request replaces its run. Every master commit gets
  # a run of its own.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # No debug info: a smaller cache and faster links. Panics still name the
  # file and line.
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  check:
    name: fmt, clippy, unit tests
    # Ubuntu 26.04's apt has FFmpeg 8.0, the oldest vidcut supports.
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # CMake, the Vulkan headers and loader, glslc and the SPIR-V headers
      # build transcribe.cpp's Vulkan backend.
      - name: Install FFmpeg 8, ALSA, libclang, CMake and Vulkan
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            libavcodec-dev \
            libavformat-dev \
            libavfilter-dev \
            libavutil-dev \
            libswscale-dev \
            libswresample-dev \
            libavdevice-dev \
            libasound2-dev \
            libclang-dev \
            pkg-config \
            cmake \
            libvulkan-dev \
            glslc \
            spirv-headers
          ver=$(dpkg-query -W -f='${Version}' libavcodec-dev)
          upstream=${ver#*:}
          major=${upstream%%.*}
          echo "libavcodec-dev ${ver} (upstream ${upstream})"
          if ! [[ "$major" =~ ^[0-9]+$ ]] || [ "$major" -lt 8 ]; then
            echo "apt FFmpeg ${upstream} is older than 8. This tree needs FFmpeg 8 headers and does not build against FFmpeg 6." >&2
            exit 1
          fi
          pkg-config --exists --print-errors \
            libavcodec libavformat libavfilter libavutil libswscale libswresample libavdevice alsa
          pkg-config --modversion libavcodec libswresample

      - name: Install the pinned Rust toolchain
        run: |
          set -euo pipefail
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.cargo/bin:$PATH"
          rustup show active-toolchain
          rustc --version
          cargo fmt --version
          cargo clippy --version
          channel=$(awk -F'"' '/^channel/ { print $2; exit }' rust-toolchain.toml)
          got=$(rustc --version | awk '{ print $2 }')
          if [ "$got" != "$channel" ]; then
            echo "expected rustc ${channel} from rust-toolchain.toml, got ${got}" >&2
            exit 1
          fi

      # After the toolchain step: the cache key includes the rustc version.
      - name: Cache compiled dependencies
        uses: Swatinem/rust-cache@v2

      - name: Fast gate
        run: make doctor check

  windows:
    name: Windows, fmt, clippy, unit tests
    runs-on: windows-2025
    timeout-minutes: 120
    env:
      VULKAN_SDK_VERSION: 1.4.363.0
      VULKAN_SDK_SHA256: 94a82d378f7a5e3e54c9db7d2fb7016af136e14ac0a18dbf0f2f67a36352d141
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The newest FFmpeg release, as a shared build from BtbN. LLVM comes
      # with the runner.
      - name: Install FFmpeg
        run: |
          set -euo pipefail
          base=https://github.com/BtbN/FFmpeg-Builds/releases/download/latest
          curl -fsSL -o checksums.sha256 "$base/checksums.sha256"
          # Such as ffmpeg-n9.0-latest-win64-gpl-shared-9.0.zip.
          zip=$(grep -oE 'ffmpeg-n[0-9]+\.[0-9]+-latest-win64-gpl-shared-[0-9.]+\.zip' checksums.sha256 | sort -V | tail -1)
          curl -fsSL -o "$zip" "$base/$zip"
          grep "  ${zip}\$" checksums.sha256 | sha256sum -c -
          unzip -q "$zip" -d "$RUNNER_TEMP"
          rm "$zip" checksums.sha256
          name=${zip%.zip}
          dir=$(cygpath -w "$RUNNER_TEMP/$name")
          {
            echo "FFMPEG_DIR=${dir}"
            echo "LIBCLANG_PATH=C:\Program Files\LLVM\bin"
          } >> "$GITHUB_ENV"
          "$RUNNER_TEMP/$name/bin/ffmpeg.exe" -hide_banner -version | head -1

      # transcribe.cpp's Vulkan backend needs the Vulkan SDK's headers, glslc
      # and vulkan-1.lib: LunarG's installer, checked against the SHA-256
      # LunarG publishes for it, and kept by version.
      - name: Cache the Vulkan SDK
        id: vulkan
        uses: actions/cache@v6
        with:
          path: C:\VulkanSDK\${{ env.VULKAN_SDK_VERSION }}
          key: vulkan-sdk-${{ env.VULKAN_SDK_VERSION }}

      - name: Install the Vulkan SDK
        if: steps.vulkan.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/vulkan_sdk.exe" \
            "https://sdk.lunarg.com/sdk/download/${VULKAN_SDK_VERSION}/windows/vulkan_sdk.exe"
          echo "${VULKAN_SDK_SHA256}  $RUNNER_TEMP/vulkan_sdk.exe" | sha256sum -c -
          "$RUNNER_TEMP/vulkan_sdk.exe" --accept-licenses --default-answer --confirm-command install
          rm "$RUNNER_TEMP/vulkan_sdk.exe"

      - name: Use the Vulkan SDK
        run: |
          set -euo pipefail
          sdk="/c/VulkanSDK/${VULKAN_SDK_VERSION}"
          echo "VULKAN_SDK=$(cygpath -w "$sdk")" >> "$GITHUB_ENV"
          cygpath -w "$sdk/Bin" >> "$GITHUB_PATH"
          "$sdk/Bin/glslc.exe" --version | head -1

      - name: Install the pinned Rust toolchain
        run: |
          set -euo pipefail
          rustup show active-toolchain
          rustc --version
          channel=$(awk -F'"' '/^channel/ { print $2; exit }' rust-toolchain.toml)
          got=$(rustc --version | awk '{ print $2 }')
          if [ "$got" != "$channel" ]; then
            echo "expected rustc ${channel} from rust-toolchain.toml, got ${got}" >&2
            exit 1
          fi

      - name: Cache compiled dependencies
        uses: Swatinem/rust-cache@v2

      - name: Fast gate
        run: scripts/check.sh

  macos:
    name: macOS, fmt, clippy, unit tests
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # ffmpeg-full, not ffmpeg, because HDR needs its zscale filter.
      # libclang comes with Xcode.
      - name: Install FFmpeg
        run: |
          set -euo pipefail
          brew install ffmpeg-full
          prefix=$(brew --prefix ffmpeg-full)
          export PKG_CONFIG_PATH="${prefix}/lib/pkgconfig"
          echo "PKG_CONFIG_PATH=${PKG_CONFIG_PATH}" >> "$GITHUB_ENV"
          pkg-config --exists --print-errors \
            libavcodec libavformat libavfilter libavutil libswscale libswresample
          pkg-config --modversion libavcodec libswresample
          "${prefix}/bin/ffmpeg" -hide_banner -version | head -1
          "${prefix}/bin/ffmpeg" -hide_banner -filters | grep -w zscale

      - name: Install the pinned Rust toolchain
        run: |
          set -euo pipefail
          rustup show active-toolchain
          rustc --version
          channel=$(awk -F'"' '/^channel/ { print $2; exit }' rust-toolchain.toml)
          got=$(rustc --version | awk '{ print $2 }')
          if [ "$got" != "$channel" ]; then
            echo "expected rustc ${channel} from rust-toolchain.toml, got ${got}" >&2
            exit 1
          fi

      - name: Cache compiled dependencies
        uses: Swatinem/rust-cache@v2

      - name: Fast gate
        run: make doctor check

