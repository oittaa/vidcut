# Fast gate only: scripts/check.sh (fmt, clippy -D warnings, unit tests).
# scripts/check.sh full (integration, e2e, doc tests) is intentionally not run here.
name: check

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read
  # Saving the cargo cache needs this when the token's default is read-only.
  actions: write

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt, clippy, unit tests
    # Pin Ubuntu 26.04. Its apt archive ships FFmpeg 8.0 (libavcodec 62).
    # ubuntu-24.04, and ubuntu-latest until the October 2026 migration,
    # ship FFmpeg 6. Those headers do not match this tree (swr_convert).
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Cache cargo registry and git db
        uses: actions/cache@v6
        with:
          # Crate files and the index, plus git deps' object db.
          # Extracted sources and target/ are rebuilt from these.
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install FFmpeg 8 and libclang
        run: |
          set -euo pipefail
          # Ubuntu 26.04 (resolute) publishes FFmpeg 8 in the archive.
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            libavcodec-dev \
            libavformat-dev \
            libavfilter-dev \
            libavutil-dev \
            libswscale-dev \
            libswresample-dev \
            libavdevice-dev \
            libclang-dev \
            pkg-config
          ver=$(dpkg-query -W -f='${Version}' libavcodec-dev)
          upstream=${ver#*:}
          major=${upstream%%.*}
          echo "libavcodec-dev ${ver} (upstream ${upstream})"
          if ! [[ "$major" =~ ^[0-9]+$ ]] || [ "$major" -lt 8 ]; then
            echo "apt FFmpeg ${upstream} is older than 8. This tree needs FFmpeg 8 headers and does not build against FFmpeg 6." >&2
            exit 1
          fi
          pkg-config --exists --print-errors \
            libavcodec libavformat libavfilter libavutil libswscale libswresample libavdevice
          pkg-config --modversion libavcodec libswresample

      - name: Install the pinned Rust toolchain
        run: |
          set -euo pipefail
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.cargo/bin:$PATH"
          # rust-toolchain.toml selects the channel and rustfmt/clippy.
          rustup show active-toolchain
          rustc --version
          cargo fmt --version
          cargo clippy --version
          channel=$(awk -F'"' '/^channel/ { print $2; exit }' rust-toolchain.toml)
          got=$(rustc --version | awk '{ print $2 }')
          if [ "$got" != "$channel" ]; then
            echo "expected rustc ${channel} from rust-toolchain.toml, got ${got}" >&2
            exit 1
          fi

      - name: Fast gate
        # CI is set, so scripts/check.sh omits cargo --quiet and the log
        # shows each crate as it compiles.
        run: scripts/check.sh
