# Fast gate only: scripts/check.sh (fmt, clippy -D warnings, unit tests), on
# Linux, Windows and macOS.
# scripts/check.sh full (integration, e2e, doc tests) is intentionally not run here.
name: check

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  # A new push to a pull request replaces its run. Every master commit gets
  # a run of its own.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # No debug info: a smaller cache and faster links. Panics still name the
  # file and line.
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  check:
    name: fmt, clippy, unit tests
    # Pin Ubuntu 26.04. Its apt archive ships FFmpeg 8.0 (libavcodec 62).
    # ubuntu-24.04, and ubuntu-latest until the October 2026 migration,
    # ship FFmpeg 6. Those headers do not match this tree (swr_convert).
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install FFmpeg 8, ALSA and libclang
        run: |
          set -euo pipefail
          # Ubuntu 26.04 (resolute) publishes FFmpeg 8 in the archive.
          # libasound2-dev: the player's audio output (cpal) builds on ALSA.
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            libavcodec-dev \
            libavformat-dev \
            libavfilter-dev \
            libavutil-dev \
            libswscale-dev \
            libswresample-dev \
            libavdevice-dev \
            libasound2-dev \
            libclang-dev \
            pkg-config
          ver=$(dpkg-query -W -f='${Version}' libavcodec-dev)
          upstream=${ver#*:}
          major=${upstream%%.*}
          echo "libavcodec-dev ${ver} (upstream ${upstream})"
          if ! [[ "$major" =~ ^[0-9]+$ ]] || [ "$major" -lt 8 ]; then
            echo "apt FFmpeg ${upstream} is older than 8. This tree needs FFmpeg 8 headers and does not build against FFmpeg 6." >&2
            exit 1
          fi
          pkg-config --exists --print-errors \
            libavcodec libavformat libavfilter libavutil libswscale libswresample libavdevice alsa
          pkg-config --modversion libavcodec libswresample

      - name: Install the pinned Rust toolchain
        run: |
          set -euo pipefail
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.cargo/bin:$PATH"
          # rust-toolchain.toml selects the channel and rustfmt/clippy.
          rustup show active-toolchain
          rustc --version
          cargo fmt --version
          cargo clippy --version
          channel=$(awk -F'"' '/^channel/ { print $2; exit }' rust-toolchain.toml)
          got=$(rustc --version | awk '{ print $2 }')
          if [ "$got" != "$channel" ]; then
            echo "expected rustc ${channel} from rust-toolchain.toml, got ${got}" >&2
            exit 1
          fi

      # After the toolchain step: the cache key includes the rustc version.
      # It keeps the compiled dependencies (target/, not vidcut's own crates)
      # and the downloaded crates. After a Cargo.lock change it restores the
      # previous cache, so only the changed dependencies are compiled again.
      - name: Cache compiled dependencies
        uses: Swatinem/rust-cache@v2

      - name: Fast gate
        # CI is set, so scripts/check.sh omits cargo --quiet and the log
        # shows each crate as it compiles.
        run: scripts/check.sh

  windows:
    name: Windows, fmt, clippy, unit tests
    runs-on: windows-2025
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # FFmpeg 9.0 as a shared build with its headers and import libraries:
      # BtbN's build of the end of a month (those are kept; the daily ones
      # go), pinned with its checksum so a run builds what the last one
      # did. Moving to a newer one is a change of these three lines. LLVM,
      # whose libclang generates the bindings, comes with the runner.
      - name: Install FFmpeg 9.0
        run: |
          set -euo pipefail
          tag=autobuild-2026-09-30-13-08
          name=ffmpeg-n9.0.2-17-g2a571b6068-win64-gpl-shared-9.0
          sha256=3da6c7b60bb9ccd73ec5b5e815ba804a0879eb362ba0e3beebce50174c022696
          curl -fsSL -o ffmpeg.zip "https://github.com/BtbN/FFmpeg-Builds/releases/download/${tag}/${name}.zip"
          echo "${sha256}  ffmpeg.zip" | sha256sum -c -
          unzip -q ffmpeg.zip -d "$RUNNER_TEMP"
          rm ffmpeg.zip
          dir=$(cygpath -w "$RUNNER_TEMP/$name")
          {
            echo "FFMPEG_DIR=${dir}"
            echo "LIBCLANG_PATH=C:\Program Files\LLVM\bin"
          } >> "$GITHUB_ENV"
          "$RUNNER_TEMP/$name/bin/ffmpeg.exe" -hide_banner -version | head -1

      - name: Install the pinned Rust toolchain
        run: |
          set -euo pipefail
          rustup show active-toolchain
          rustc --version
          channel=$(awk -F'"' '/^channel/ { print $2; exit }' rust-toolchain.toml)
          got=$(rustc --version | awk '{ print $2 }')
          if [ "$got" != "$channel" ]; then
            echo "expected rustc ${channel} from rust-toolchain.toml, got ${got}" >&2
            exit 1
          fi

      - name: Cache compiled dependencies
        uses: Swatinem/rust-cache@v2

      - name: Fast gate
        run: scripts/check.sh

  macos:
    name: macOS, fmt, clippy, unit tests
    # Apple Silicon (arm64), pinned like the others.
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Homebrew's FFmpeg: its newest release, with its headers and
      # pkg-config files. Not pinned: Homebrew keeps one version of a
      # formula. libclang, which generates the bindings, comes with Xcode.
      - name: Install FFmpeg
        run: |
          set -euo pipefail
          brew install ffmpeg
          pkg-config --exists --print-errors             libavcodec libavformat libavfilter libavutil libswscale libswresample
          pkg-config --modversion libavcodec libswresample
          ffmpeg -hide_banner -version | head -1

      - name: Install the pinned Rust toolchain
        run: |
          set -euo pipefail
          rustup show active-toolchain
          rustc --version
          channel=$(awk -F'"' '/^channel/ { print $2; exit }' rust-toolchain.toml)
          got=$(rustc --version | awk '{ print $2 }')
          if [ "$got" != "$channel" ]; then
            echo "expected rustc ${channel} from rust-toolchain.toml, got ${got}" >&2
            exit 1
          fi

      # As on Linux and Windows: master's run saves the compiled
      # dependencies, and every later run (pull requests too) starts from
      # them.
      - name: Cache compiled dependencies
        uses: Swatinem/rust-cache@v2

      - name: Fast gate
        run: scripts/check.sh
