# Opens update pull requests. Auto-merge is not enabled.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      # Listed first so these crates leave the group below. They share one
      # shadcn-egui-core; a pull request updates every one that has a release.
      shadcn-egui:
        patterns:
          - "shadcn-egui*"
        update-types:
          - minor
          - patch
      cargo-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # rust-toolchain.toml's channel. Raising it takes rust-version in
  # Cargo.toml with it and fixes for what the new clippy finds, which the
  # pull request's checks show.
  - package-ecosystem: rust-toolchain
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
