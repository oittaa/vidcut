# Opens update pull requests. Auto-merge is not enabled.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      cargo-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  # OpenTimelineIO's Python library, which CI checks vidcut's OTIO files
  # against.
  - package-ecosystem: pip
    directory: /tests/otio
    schedule:
      interval: weekly
