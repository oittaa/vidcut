[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
# The toolchain pinned in rust-toolchain.toml (installed by rustup). The
# MSRV-aware resolver picks dependency versions that build with it.
rust-version = "1.99"
license = "MIT"

[workspace.dependencies]
vidcut-core = { path = "crates/vidcut-core" }
vidcut-av = { path = "crates/vidcut-av" }

anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
schemars = "1"
toml = "1.1"
# Installed fonts by family name, for themes.
fontdb = "0.24"
# Fonts built into the app for themes, the same on every computer: Geist,
# Geist Mono, Space Grotesk. OFL-1.1, the crates' code MIT. Exact versions:
# the crates are new.
shadcn-egui-font-geist = "=0.4.0"
shadcn-egui-font-geist-mono = "=0.4.0"
shadcn-egui-font-space-grotesk = "=0.4.0"
# A font's metrics, to center its capitals in a line (the version epaint
# lays text out with).
skrifa = "0.48"
# The desktop portal's light or dark setting and accent color on Linux.
# MIT.
zbus = "5"
ctrlc = "3"
# Test outputs in temp dirs that remove themselves, also when a test fails.
tempfile = "3"
# Drives the egui GUI with simulated input in tests (no renderer).
clap = { version = "4.6", features = ["env", "string"] }
libc = "0.2"
# Windows's own calls where the standard library has none: named pipes for
# live control, thread priorities, memory size, the GPU drivers' versions,
# the shell showing a file. MIT or Apache-2.0.
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_ProcessStatus",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }
# COM calls: Direct3D 11 textures the decoder and the viewer share. MIT or
# Apache-2.0.
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Wdk_Graphics_Direct3D",
    "Win32_Security",
] }
# Vulkan calls on wgpu's own device (the version wgpu-hal uses): memory the
# viewer shares with CUDA. MIT or Apache-2.0.
ash = { version = "0.38", default-features = false, features = ["std"] }
# Metal textures of VideoToolbox's IOSurfaces on wgpu's Metal device
# (macOS), the versions wgpu-hal uses. Zlib, Apache-2.0 or MIT.
objc2-metal = { version = "0.3", default-features = false, features = [
    "std",
    "MTLAllocation",
    "MTLDevice",
    "MTLPixelFormat",
    "MTLResource",
    "MTLTexture",
    "objc2-io-surface",
] }
objc2-io-surface = { version = "0.3", default-features = false, features = [
    "std",
    "IOSurfaceRef",
] }
# macOS's appearance and accent color, for native themes.
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "NSColor",
    "NSColorSpace",
    "NSResponder",
    "NSView",
    "NSWindow",
    "objc2-core-foundation",
] }
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "NSString",
    "NSUserDefaults",
] }
# Loads CUDA's driver library for the calls FFmpeg doesn't make (memory a
# display shares). ISC.
libloading = "0.9"
# Links the system FFmpeg 8.0 via pkg-config; bindings are generated with bindgen.
# The crate's version numbers follow FFmpeg's, but it detects the installed
# FFmpeg and compiles only what that version has, so 9.x builds against 8.0.
ffmpeg-next = { version = "9.0", default-features = false, features = [
    "codec",
    "filter",
    "format",
    "software-resampling",
    "software-scaling",
] }
# On wgpu (below): the viewer's pictures are textures the GUI's own GPU
# shader converts.
eframe = { version = "0.36", default-features = false, features = [
    "accesskit",
    "default_fonts",
    "wgpu_no_default_features",
    "wayland",
    "x11",
] }
# The GPU the GUI draws with (eframe's renderer) and the viewer's pictures
# are converted on: Vulkan on Linux and Windows, Metal on macOS, DX12 on
# Windows. No OpenGL backend.
wgpu = { version = "30", default-features = false, features = [
    "std",
    "wgsl",
    "vulkan",
    "metal",
    "dx12",
] }
# Waits for wgpu's adapter and device without a window (tests).
pollster = "1"
# Checks the viewer's WGSL in unit tests, without a GPU (wgpu's own parser).
naga = { version = "30", features = ["wgsl-in"] }
# Direct dep only to keep winit's default features (client-side decorations on
# GNOME/Wayland, runtime-loaded libwayland), which eframe enables only by default.
winit = "0.30"
# Icons for the timeline's controls (Phosphor). MIT or Apache-2.0.
egui-phosphor = "0.14"
# Watches the project's and the preferences' folders. On macOS through
# FSEvents (its only backend there; without it notify doesn't build).
notify = { version = "8.2", default-features = false, features = ["macos_fsevent"] }
rfd = "0.17"
# Shell quoting for the commands the GUI shows ("the same export from a shell").
shlex = "2.0"
# OpenTimelineIO bundles (.otioz) are zip files: stored media, a deflated
# timeline. Pure Rust (zlib-rs), MIT.
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }
# Reads TTML subtitle files (DFXP, IMSC1). MIT or Apache-2.0.
roxmltree = "0.20"
# Checks media already unpacked from a bundle against its CRC-32.
crc32fast = "1.5"
# SHA-256: media fingerprints, to tell a moved file from another one when
# relinking, and the names and checks of vidcut's own files. Pure Rust, MIT
# or Apache-2.0.
sha2 = "0.11"
# The player's audio output (ALSA on Linux, which PipeWire and PulseAudio
# serve). Apache-2.0; needs libasound2-dev to build.
cpal = "0.18"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

# Dependencies (egui, image handling) are unbearably slow unoptimized; our own
# crates stay at opt-level 0 for fast incremental builds.
[profile.dev.package."*"]
opt-level = 2
