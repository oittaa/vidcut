[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
# The toolchain pinned in rust-toolchain.toml (installed by rustup). The
# MSRV-aware resolver picks dependency versions that build with it.
rust-version = "1.99"
license = "MIT"

[workspace.dependencies]
vidcut-core = { path = "crates/vidcut-core" }
vidcut-av = { path = "crates/vidcut-av" }
vidcut-mpv = { path = "crates/vidcut-mpv" }

anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
toml = "1.1"
ctrlc = "3"
proptest = "1"
insta = { version = "1", features = ["json"] }
# Drives the egui GUI with simulated input in tests (no renderer).
egui_kittest = { version = "0.36", default-features = false }
clap = { version = "4.6", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
libc = "0.2"
libloading = "0.9"
# Links the system FFmpeg 8.0 via pkg-config; bindings are generated with bindgen.
# The crate's version numbers follow FFmpeg's, but it detects the installed
# FFmpeg and compiles only what that version has, so 9.x builds against 8.0.
ffmpeg-next = { version = "9.0", default-features = false, features = [
    "codec",
    "filter",
    "format",
    "software-resampling",
    "software-scaling",
] }
# glow (OpenGL) backend: libmpv's render API needs a GL context.
eframe = { version = "0.36", default-features = false, features = [
    "accesskit",
    "default_fonts",
    "glow",
    "wayland",
    "x11",
] }
# Direct dep only to keep winit's default features (client-side decorations on
# GNOME/Wayland, runtime-loaded libwayland), which eframe enables only by default.
winit = "0.30"
# Platform display handle passed to libmpv for hardware-decoding interop.
raw-window-handle = "0.6"
notify = { version = "8.2", default-features = false }
rfd = "0.17"
# Shell quoting for the commands the GUI shows ("the same export from a shell").
shlex = "2.0"
# OpenTimelineIO bundles (.otioz) are zip files: stored media, a deflated
# timeline. Pure Rust (zlib-rs), MIT.
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }
# Checks media already unpacked from a bundle against its CRC-32.
crc32fast = "1.5"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

# Dependencies (egui, image handling) are unbearably slow unoptimized; our own
# crates stay at opt-level 0 for fast incremental builds.
[profile.dev.package."*"]
opt-level = 2
